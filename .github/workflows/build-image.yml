# Construit et publie l'image CI (Dockerfile) sur ghcr.io, consommee par
# generation.yml. A lancer une fois apres avoir cree sa copie privee du
# depot (cf. README.md), et a chaque fois que Dockerfile change.
#
# N'ecrit ni ne lit aucune donnee de site : uniquement le toolchain (JDK,
# GDAL, roofer, Sweet Home 3D, paquets Python), aucun secret necessaire ici.
#
# Declenchement pull_request (memes paths) : construit SANS publier
# (push: false ci-dessous) -- valide qu'un Dockerfile/requirements-venv.txt
# modifie construit encore avant le merge, plutot que de le decouvrir apres
# coup sur le push vers main (seul moment ou l'image etait testee jusqu'ici).
# Utile en particulier pour une PR Dependabot sur requirements-venv.txt.
name: Construire l'image CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile', 'config/requirements-venv.txt']
  pull_request:
    paths: ['Dockerfile', 'config/requirements-venv.txt']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connexion a ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `github.repository` peut contenir des majuscules (ex.
      # "sweethome3D-importgeo"), interdites dans un chemin GHCR/OCI --
      # push echouerait sinon avec "must be lowercase".
      #
      # Deux tags publies (hors PR, cf. `push:` plus bas) : `:latest`
      # (mutable, seul tag consomme par generation.yml/render.yml) et
      # `:<sha>` (immutable, jamais reecrit) -- permet de figer un
      # generation.yml cassé sur un commit precis (`ghcr.io/.../ci:<sha>`)
      # en attendant un correctif, plutot que de dependre uniquement du
      # dernier `:latest` pousse (mono-tag sans rollback, risque deja note
      # dans CLAUDE.md section Environnement).
      - name: Minuscules (requis par OCI/GHCR)
        id: image
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "latest=ghcr.io/${repo}/ci:latest" >> "$GITHUB_OUTPUT"
          echo "sha=ghcr.io/${repo}/ci:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Requis par cache-to/cache-from: type=gha ci-dessous : sur un runner
      # GitHub-hosted standard, docker/build-push-action utilise par defaut le
      # driver "docker", qui ne supporte pas l'export de cache GHA -- sans ce
      # step, le build peut echouer purement et simplement plutot que
      # simplement ne pas mettre en cache.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cache de build GitHub Actions : ne change rien sur un premier build a
      # froid (rien a reutiliser), mais accelere fortement les rebuilds
      # suivants (ex. bump de version dans le Dockerfile) en reutilisant les
      # layers apt/pip deja construits plutot que tout retelecharger.
      # `mode=max` cache aussi les layers intermediaires (pas seulement la
      # couche finale), pour maximiser la reutilisation sur les etapes
      # roofer/Sweet Home 3D qui changent rarement.
      # push: false sur pull_request -- construit pour valider seulement,
      # ne publie jamais depuis une PR (cf. commentaire d'en-tete).
      - name: Build ${{ github.event_name == 'pull_request' && '(validation, sans publier)' || '+ push' }} ${{ steps.image.outputs.latest }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.latest }}
            ${{ steps.image.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
